    <div class="muted">Decision Center redesign · handoff · Nov 9, 2026</div>
    <h1 style="margin: 4px 0 6px; font-size: 30px; letter-spacing: -0.03em">Charts, interactions and what they need</h1>
    <p style="margin: 0; color: #34445a">Built from the local <code>decision_dashboard_v2</code> source and a read-only review of all four live Railway pages (Home, Products, PPC, Decisions) on Nov 9, done in the Claude app browser because the Chrome extension was not connected. The prototype uses synthetic data only. This is a design proposal: it does not change requirements, scoring thresholds or policy.</p>
    <div style="display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px"><span class="tag t-ok">Exists</span><span class="tag t-part">Exists locally / partial</span><span class="tag t-new">New backend logic</span><span class="tag t-gap">Data gap</span></div>
  </div>

  <section class="card">
    <h2>How today's Top 3 is assembled</h2>
    <ol>
      <li><code>executive()</code> calls <code>action_queue()</code>, which scores ASIN alerts by severity. For Litet, that queue only decides whether any step exists at all.</li>
      <li><code>executive_actions()</code> (Litet branch) returns steps in a fixed order: <b>ACT NOW: stop PPC budget increases</b>, then <b>WATCH: do not change price from four days of demand</b>, then <b>ACT NOW: confirm replenishment</b> for the lowest-cover ASIN (only when the inventory query returns a row).</li>
      <li>Local <code>app.py</code> removes steps that mention PPC or bids, and always inserts <b>Review current advertising evidence</b> at position 1. <code>executive_diagnosis()</code> then takes the first three.</li>
    </ol>
    <p style="margin: 10px 0 0"><b>Fixed priorities:</b> local positions 1 (advertising review) and 2 (price watch) are always present and always in that order; only #3 (inventory) is conditional. Live positions 1 and 2 are also fixed. Nothing is ranked by urgency, impact or freshness. The text "four days" is hard-coded; the live view covered 9 days. The inventory step is labeled ACT NOW even at 40 days of cover.</p>
  </section>

        <tr><td></td><td>Why it surfaced · comparison period · last update · Investigate link</td><td><code>overview</code>, <code>ppc_coverage</code>, <code>build_page</code> freshness (max report date, imported_at)</td><td>Per-source freshness (orders, PPC, inventory snapshot, Business Report traffic) plus deep links that carry pack, ASIN and campaign parameters.</td><td><span class="tag t-part">Partial</span></td></tr>
        <tr><td></td><td>Daily sales and daily orders vs prior period</td><td><code>orders</code> with <code>amazon_us_date</code>; <code>monthly_trend</code> is monthly only</td><td>Daily series endpoint (sales, distinct orders, prior-period overlay). Missing import days must be null, not 0.</td><td><span class="tag t-part">Small</span></td></tr>
        <tr><td></td><td>Settled contribution by month (separate from operating view)</td><td><code>pnl_statement</code>, <code>overview.contribution_after_cogs</code></td><td>A monthly series with an explicit "settled through" date. Unsettled months return null with a reason.</td><td><span class="tag t-part">Partial</span></td></tr>
        <tr><td></td><td>Scenario: stale data reorders priorities</td><td>None</td><td>Staleness thresholds per source (proposal). The freshness factor feeds ranking.</td><td><span class="tag t-new">New</span></td></tr>
        <tr><td><b>Products</b></td><td>Ranked pack bars · Sales / Units</td><td><code>product_portfolio.pack_groups</code> (sales, units); <code>previous_period</code></td><td>Return prior-period values for the marker.</td><td><span class="tag t-ok">Exists</span></td></tr>
        <tr><td></td><td>Contribution switch</td><td><code>product_diagnostics.net_proceeds</code> (before COGS); COGS seed</td><td>Per-ASIN settled contribution after COGS, with a missing count when fees are unsettled. Settled month only.</td><td><span class="tag t-new">Medium</span></td></tr>
        <tr><td></td><td>Color × size heatmap per pack</td><td>Portfolio rows (color, size, pack); color and size groups</td><td>Matrix payload that distinguishes "no data", "not offered" (from <code>dim_product</code>) and a real zero.</td><td><span class="tag t-part">Small</span></td></tr>
        <tr><td></td><td>ASIN detail: daily sales, sellable stock trend, exact values</td><td><code>orders</code> by ASIN; <code>inventory_availability</code> by <code>snapshot_date</code></td><td>Two daily queries. Inbound/AWD quantity is not captured.</td><td><span class="tag t-gap">Inbound gap</span></td></tr>
        <tr><td></td><td>Distinct missing-value treatment</td><td>Templates render None as "—" and zero as "$0.00"</td><td>APIs return null plus a reason code. UI renders hatched "No data" and never coerces null to 0.</td><td><span class="tag t-new">Contract</span></td></tr>
        <tr><td><b>PPC</b></td><td>Aligned brand sales / spend / TACoS daily with the recent window shaded</td><td>Local <code>ppc_page.build_page</code> (<code>daily</code>, <code>company</code>, <code>prior</code>); workspace mature/recent windows</td><td>Expose mature end date and recent window in the page payload.</td><td><span class="tag t-part">Local only</span></td></tr>
        <tr><td></td><td>Campaign spend vs attributed sales scatter → filters table; brand totals stable</td><td>Campaign aggregation of <code>ppc_fact_clean</code> (as in <code>executive_actions</code>); local campaign select already keeps company totals brand-level</td><td>Per-campaign aggregate for the period. Client-side filter so KPIs and trends never re-scope.</td><td><span class="tag t-part">Small</span></td></tr>
        <tr><td></td><td>Searchable target table</td><td>Local <code>ppc_decisions.js</code> search, action, match and status filters</td><td>Reuse it.</td><td><span class="tag t-part">Local only</span></td></tr>

        <tr><td><b>Decisions</b></td><td>Pending review / Monitoring / History tabs</td><td><code>interventions</code> statuses; <code>_intervention_rollup</code></td><td>Map dismissed, completed and reverted to History.</td><td><span class="tag t-ok">Exists</span></td></tr>
        <tr><td></td><td>Timeline: proposal → approval → recorded change → outcome</td><td><code>created_at</code>, <code>executed_at</code>, <code>review_date</code>, status</td><td>Status-change audit with timestamps and actor (approval time is not clearly stored). Owner-reported vs confirmed flag.</td><td><span class="tag t-new">Medium</span></td></tr>
        <tr><td></td><td>Before/after chart only when windows are comparable</td><td><code>ppc_change_impact</code> (daily-rate before/after)</td><td>A comparability rule: equal complete windows, attribution matured, no overlapping change, change day excluded. Otherwise show "not comparable" with the reason.</td><td><span class="tag t-new">Rule</span></td></tr>
        <tr><td></td><td>Path to product pricing decisions</td><td><code>/decisions/pricing</code>, <code>pricing_case</code>, <code>record_pricing_case</code> (live returns 200)</td><td>Add links from Decisions and from ASIN detail. None exist today.</td><td><span class="tag t-part">Small</span></td></tr>
        <tr><td><b>All</b></td><td>One shell, nav and freshness indicator; stale/empty/insufficient states</td><td>Four templates with four different navs</td><td>A shared base template and a freshness API.</td><td><span class="tag t-part">Refactor</span></td></tr>

  <section class="card">
    <h2>Open for review (UX · engineering · QA)</h2>
    <ul>
      <li>Ranking formula, qualification thresholds and staleness thresholds are proposals. PM approval is needed before implementation.</li>
      <li>The recent window is drawn as the last 7 days. Confirm it against the 14-day attribution policy and the Nov 4–10 checkpoint.</li>
      <li>Budget utilization is shown without out-of-budget hours, so it must not be read as a constraint signal.</li>
      <li>The wireframe does not prove recommendation logic or source readiness. Before implementation-ready status, QA should reuse the acceptance cases in PPC-DECISION-RULES.md.</li>
      <li>No pages were inaccessible. No screenshots, databases, credentials, environment files or Railway settings were used.</li>
    </ul>
