<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Hasten · Data Sync</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    body { margin: 0; background: #08111f; color: #e9f0f8; }
    main { width: min(680px, calc(100% - 40px)); margin: 10vh auto; }
    .card { background: #111d2e; border: 1px solid #263750; border-radius: 18px; padding: 28px; box-shadow: 0 24px 70px #0008; }
    h1 { margin: 0 0 8px; font-size: 28px; }
    p { color: #aebed1; line-height: 1.55; }
    label { display: block; margin: 20px 0 8px; font-weight: 700; }
    input { box-sizing: border-box; width: 100%; padding: 12px; color: inherit; background: #091321; border: 1px solid #3a4e6a; border-radius: 9px; }
    button { margin: 18px 8px 0 0; padding: 11px 17px; border: 0; border-radius: 9px; background: #46b3ff; color: #03101b; font-weight: 800; cursor: pointer; }
    button.secondary { background: #243851; color: #e9f0f8; }
    #status { min-height: 24px; margin-top: 18px; color: #8ed5a6; white-space: pre-wrap; }
    .warning { color: #ffc980; }
  </style>
</head>
<body>
<main>
  <div class="card">
    <h1>Data synchronization</h1>
    <p>Upload a gzip-compressed <code>litet.db</code> produced by the verified local ETL, or download the canonical Railway snapshot for offline use.</p>
    <p class="warning">Keep this token private. The server validates every database before replacing the live snapshot.</p>
    <label for="token">Admin token</label>
    <input id="token" type="password" autocomplete="current-password">
    <label for="database">Compressed database (.db.gz)</label>
    <input id="database" type="file" accept=".gz,application/gzip">
    <button id="upload">Validate and upload</button>
    <button id="download" class="secondary">Download offline snapshot</button>
    <div id="status" role="status"></div>
  </div>
</main>
<script>
  const status = document.querySelector('#status');
  const headers = () => ({Authorization: `Bearer ${document.querySelector('#token').value}`});
  document.querySelector('#upload').onclick = async () => {
    const file = document.querySelector('#database').files[0];
    if (!file) { status.textContent = 'Choose a .db.gz file first.'; return; }
    status.textContent = 'Uploading and validating…';
    const response = await fetch('/admin/database', {method: 'PUT', headers: {...headers(), 'Content-Type': 'application/gzip'}, body: file});
    const result = await response.json();
    status.textContent = response.ok ? `Upload complete (${result.bytes.toLocaleString()} bytes).` : `Upload failed: ${result.reason}`;
  };
  document.querySelector('#download').onclick = async () => {
    status.textContent = 'Preparing snapshot…';
    const response = await fetch('/admin/database', {headers: headers()});
    if (!response.ok) { const result = await response.json(); status.textContent = `Download failed: ${result.reason}`; return; }
    const blob = await response.blob();
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob); link.download = 'litet.db.gz'; link.click();
    URL.revokeObjectURL(link.href); status.textContent = 'Download complete.';
  };
</script>
</body>
</html>
